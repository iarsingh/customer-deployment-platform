name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the platform API
        run: |
          python -m pip install -r platform-api/requirements.txt
          PYTHONPATH=platform-api pytest platform-api/tests -q

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the rendered service shape
        run: |
          python -m pip install -r templates/python-service/requirements.txt
          PYTHONPATH=templates/python-service pytest templates/python-service/tests -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Validate the local environment
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform/environments/local init -backend=false
          terraform -chdir=terraform/environments/local validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Render the sample chart
        run: helm template billing-callback helm/service -f helm/service/values.yaml > /tmp/rendered.yaml
      - name: Refuse an image tag of latest
        run: |
          if grep -q ':latest' /tmp/rendered.yaml; then
            echo "rendered chart contains the tag latest" >&2
            exit 1
          fi
          grep -q 'cpu: 100m' /tmp/rendered.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/rendered.yaml
