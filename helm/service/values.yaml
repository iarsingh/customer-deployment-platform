name: billing-callback
team: payments
environment: dev
namespace: payments-dev
replicaCount: 2
image:
  repository: billing-callback
  tag: "0.1.0"
service:
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
